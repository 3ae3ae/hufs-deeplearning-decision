[project]
name = "deeplearning-decision"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "funasr==1.4.16",
    "kiwipiepy==0.24.1",
    "laya==0.4.15",
    "numpy==2.2.6",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
